$schema: https://json-schema.org/draft/2020-12/schema
description: Schema for user-provided European industrial energy-demand configuration.
type: object
additionalProperties: false
required:
- scenarios
- historical_calibration
- spatial_disaggregation
- visualization
properties:
  scenarios:
    description: Named scenarios combining projection assumptions and technology definitions.
    type: object
    propertyNames:
      minLength: 1
    minProperties: 1
    additionalProperties:
      description: Input files defining one scenario.
      type: object
      additionalProperties: false
      required:
      - projection_input
      - technology_input
      properties:
        projection_input:
          description: Projection YAML filename or relative path below the projection_inputs pathvar.
          type: string
          minLength: 1
        technology_input:
          description: Technology YAML filename or relative path below the technology_inputs pathvar.
          type: string
          minLength: 1
  historical_calibration:
    description: Historical production and chemical energy-demand calibration assumptions. The model uses JRC_IDEES data, however,
      some sectors are not covered by JRC_IDEES and require user-supplied production and energy-demand assumptions.
      The model uses these assumptions to calibrate the historical energy demand of the industrial sector.
    type: object
    additionalProperties: false
    required:
    - reference_year
    - production_Mt_per_year
    - energy_density_MWh_per_t
    - energy_feedstock_MWh_per_t
    - ammonia
    - coke_oven_allocation
    if:
      properties:
        ammonia:
          const: true
      required:
      - ammonia
    then:
      properties:
        energy_density_MWh_per_t:
          required:
          - NH3
    properties:
      reference_year:
        description: Historical year, from 2000 to 2021. Switzerland requires 2014 or later.
        type: integer
        minimum: 2000
        maximum: 2021
      production_Mt_per_year:
        description: European annual production used to calibrate chemical subsectors.
        type: object
        additionalProperties: false
        required:
        - basic_chemicals_without_NH3
        - HVC
        - chlorine
        - methanol
        properties:
          basic_chemicals_without_NH3:
            description: European non-ammonia basic-chemicals production in Mt/a, used to allocate chemical
              subsectors.
            type: number
            exclusiveMinimum: 0
          HVC:
            description: European high-value chemicals production in Mt/a.
            type: number
            minimum: 0
          chlorine:
            description: European chlorine production in Mt/a.
            type: number
            minimum: 0
          methanol:
            description: European methanol production in Mt/a.
            type: number
            minimum: 0
      energy_density_MWh_per_t:
        description: Carrier energy content in MWh per tonne of the named carrier. NH3 is required only when ammonia is true.
        type: object
        additionalProperties: false
        properties:
          NH3:
            description: Ammonia carrier energy content in MWh per tonne of ammonia.
            type: number
            exclusiveMinimum: 0
      energy_feedstock_MWh_per_t:
        description: Energy and feedstock inputs in MWh per tonne of product.
        type: object
        additionalProperties: false
        required:
        - H2_per_NH3_electrolysis
        - elec_per_NH3_electrolysis
        - elec_per_Cl
        - H2_per_Cl
        - elec_per_MeOH
        - CH4_per_MeOH
        properties:
          H2_per_NH3_electrolysis:
            description: Hydrogen demand in MWh per tonne of ammonia for the reconstructed electrolysis route.
            type: number
            minimum: 0
          elec_per_NH3_electrolysis:
            description: Electricity demand in MWh per tonne of ammonia for the reconstructed electrolysis
              route.
            type: number
            minimum: 0
          elec_per_Cl:
            description: Electricity demand in MWh per tonne of chlorine.
            type: number
            minimum: 0
          H2_per_Cl:
            description: Net hydrogen demand in MWh per tonne of chlorine; negative values represent coproduct
              hydrogen credits.
            type: number
          elec_per_MeOH:
            description: Electricity demand in MWh per tonne of methanol.
            type: number
            minimum: 0
          CH4_per_MeOH:
            description: Methane demand in MWh per tonne of methanol.
            type: number
            minimum: 0
      ammonia:
        description: Represent ammonia demand with an ammonia carrier when true. Otherwise expose reconstructed
          hydrogen and electricity inputs.
        type: boolean
      coke_oven_allocation:
        description: Fraction of coke-oven transformation output attributed to integrated BF-BOF steelworks.
        type: number
        minimum: 0
        maximum: 1
  spatial_disaggregation:
    description: Regional allocation of national industry production and energy demand.
    type: object
    additionalProperties: false
    required:
    - years
    - fallback_options
    - population
    - user_key
    properties:
      years:
        description: Years to regionalize. null retains all available years.
        type:
        - array
        - 'null'
        items:
          description: Year to regionalize.
          type: integer
        minItems: 1
        uniqueItems: true
      fallback_options:
        description: Alternative ways to distribute industry across regions, tried in order when Hotmaps
          data for the specific industry is unavailable.
        type: array
        items:
          description: Fallback allocation method.
          type: string
          oneOf:
          - const: generic_industry
            description: Use all Hotmaps industrial sites in the same country.
          - const: population
            description: Use regional population weights from the supplied CSV, when enabled.
          - const: user_key
            description: Use your own regional weights from the supplied CSV, when enabled.
          - const: uniform
            description: Give every region in the country an equal share.
        uniqueItems: true
        minItems: 1
      population:
        description: Optional population weights supplied through the population pathvar.
        $ref: '#/$defs/regional_key'
      user_key:
        description: Optional custom regional weights supplied through the user_key pathvar.
        $ref: '#/$defs/regional_key'
  visualization:
    description: Selection of energy layers, charts, and spatial maps.
    type: object
    additionalProperties: false
    required:
    - energy_layer
    - include_plots
    properties:
      energy_layer:
        description: 'Energy layer shown in energy charts and maps: final energy consumption (FEC) or
          useful energy demand (UED).'
        type: string
        enum:
        - FEC
        - UED
      include_plots:
        description: Charts and maps to generate. An empty list disables all visualizations.
        type: array
        items:
          description: Chart or map identifier.
          type: string
          enum:
          - production_overview
          - production_route
          - energy_by_sector_map
          - energy_by_carrier_map
          - energy_by_carrier
          - energy_by_commodity
          - production_map
          - energy_by_commodity_map
        uniqueItems: true
$defs:
  regional_key:
    description: Column mapping for a regional-weight CSV; weights are renormalized over regions present
      in the shapes.
    type: object
    additionalProperties: false
    required:
    - enabled
    - region_column
    - country_column
    - weight_column
    - source_name
    properties:
      enabled:
        description: Whether to load and use the CSV supplied through the corresponding pathvar.
        type: boolean
      region_column:
        description: CSV column containing region identifiers matching the shapes.
        type: string
        minLength: 1
      country_column:
        description: CSV column containing country identifiers.
        type: string
        minLength: 1
      weight_column:
        description: CSV column containing nonnegative regional weights; weights need not sum to one.
        type: string
        minLength: 1
      source_name:
        description: Source label recorded for this allocation key in the output.
        type: string
        minLength: 1
