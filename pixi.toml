[workspace]
name = "euro-industry-data"
description = "Historical European industrial production and energy-demand calibration workflow"
channels = ["conda-forge", "bioconda"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[dependencies]
python = ">=3.12,<3.13"
snakemake-minimal = ">=8.10,<10"
pandas = ">=2.2"
numpy = ">=2.0"
openpyxl = ">=3.1"
pyxlsb = ">=1.0.10"
country_converter = ">=1.3"
pyyaml = ">=6"
plotly = ">=7.1.0,<8"
geopandas = ">=1.1.4,<2"
pyogrio = ">=0.13.0,<0.14"
shapely = ">=2.1.2,<3"
pydeck = ">=0.9.3,<0.10"

[tasks]
download = "snakemake --snakefile workflow/Snakefile --cores 1 resources/automatic/.downloads_complete"
prepare = "snakemake --snakefile workflow/Snakefile --cores 1 results/historical/.prepare_complete"
project-production = "snakemake --snakefile workflow/Snakefile --cores 1 results/projections/production.csv"
projections = "snakemake --snakefile workflow/Snakefile --cores 1 results/projections/.projections_complete"
demand = "snakemake --snakefile workflow/Snakefile --cores 1 results/demand/.demand_complete"
plots = "snakemake --snakefile workflow/Snakefile --cores 1 plots_all"
spatial-maps = "snakemake --snakefile workflow/Snakefile --cores 1 spatial_maps_all"
run = "snakemake --snakefile workflow/Snakefile --cores 1"
spatial = "snakemake --snakefile workflow/Snakefile --cores 1 spatial_all"
dry-run = "snakemake --snakefile workflow/Snakefile --cores 1 --dry-run"
list = "snakemake --snakefile workflow/Snakefile --list"
