scenarios:
  retain_max_electrification:
    projection_input:
      retain_max_electrification.yaml
    technology_input: technologies.yaml
  industrial_relocation:
    projection_input:
      industrial_relocation.yaml
    technology_input: technologies.yaml

historical_calibration:
  reference_year: 2019

  basic_chemicals_without_NH3_production_today: 69.0
  HVC_production_today: 52.0
  chlorine_production_today: 9.58
  methanol_production_today: 1.5

  MWh_NH3_per_tNH3: 5.166
  MWh_H2_per_tNH3_electrolysis: 5.93
  MWh_elec_per_tNH3_electrolysis: 0.2473
  MWh_elec_per_tCl: 3.6
  MWh_H2_per_tCl: -0.9372
  MWh_elec_per_tMeOH: 0.167
  MWh_CH4_per_tMeOH: 10.25

  ammonia: true

  coke_oven_allocation: 0.75

spatial_disaggregation:
  years:
    - 2030
    - 2040
    - 2050

  fallback_options:
    - generic_industry
    - population
    - user_key
    - uniform

  population:
    enabled: false
    region_column: name
    country_column: ct
    weight_column: fraction
    source_name: population

  user_key:
    enabled: false
    region_column: region
    country_column: country
    weight_column: share
    source_name: user_key

visualization:
  energy_layer: FEC
  include_plots:
    - production_overview
    - production_route
    - energy_by_sector_map
    - energy_by_carrier_map
    - energy_by_carrier
    - energy_by_commodity
    - production_map
    - energy_by_commodity_map
