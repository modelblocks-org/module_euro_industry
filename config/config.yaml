scenarios:
  retain_max_electrification:
    projection_input:
      retain_max_electrification.yaml
    technology_input: technologies.yaml
  industrial_relocation:
    projection_input:
      industrial_relocation.yaml
    technology_input: technologies.yaml

historical_calibration:
  reference_year: 2019

  production_Mt_per_year:
    basic_chemicals_without_NH3: 69.0
    HVC: 52.0
    chlorine: 9.58
    methanol: 1.5

  energy_density_MWh_per_t:
    NH3: 5.166
  energy_feedstock_MWh_per_t:
    H2_per_NH3_electrolysis: 5.93
    elec_per_NH3_electrolysis: 0.2473
    elec_per_Cl: 3.6
    H2_per_Cl: -0.9372
    elec_per_MeOH: 0.167
    CH4_per_MeOH: 10.25

  ammonia: true

  coke_oven_allocation: 0.75

spatial_disaggregation:
  years:
    - 2030
    - 2040
    - 2050

  fallback_options:
    - generic_industry
    - population
    - user_key
    - uniform

  population:
    enabled: false
    region_column: name
    country_column: ct
    weight_column: fraction
    source_name: population

  user_key:
    enabled: false
    region_column: region
    country_column: country
    weight_column: share
    source_name: user_key

visualization:
  energy_layer: FEC
  include_plots:
    - production_overview
    - production_route
    - energy_by_sector_map
    - energy_by_carrier_map
    - energy_by_carrier
    - energy_by_commodity
    - production_map
    - energy_by_commodity_map
