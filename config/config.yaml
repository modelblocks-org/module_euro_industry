historical_calibration:
  reference_year: 2019

  # JRC-IDEES does not provide the chemical subsector disaggregation required
  # by the model. Ammonia is taken from USGS. HVC, chlorine and methanol are
  # allocated across countries using each country's residual non-ammonia
  # basic-chemicals production, preserving the calibration of the old model.
  # Note: this is a calibration convention, not a physical mass balance,
  # because JRC reports basic chemicals in ethylene-equivalent output.
  basic_chemicals_without_NH3_production_today: 69.0  # Mt/a
  HVC_production_today: 52.0                           # Mt/a
  chlorine_production_today: 9.58                     # Mt/a
  methanol_production_today: 1.5                      # Mt/a

  # Historical chemical energy-demand reconstruction.
  MWh_NH3_per_tNH3: 5.166
  MWh_H2_per_tNH3_electrolysis: 5.93
  MWh_elec_per_tNH3_electrolysis: 0.2473
  MWh_elec_per_tCl: 3.6
  MWh_H2_per_tCl: -0.9372
  MWh_elec_per_tMeOH: 0.167
  MWh_CH4_per_tMeOH: 10.25

  # Keep the legacy convention in which ammonia demand is represented as an
  # ammonia carrier. Set false only if the historical baseline should instead
  # expose the reconstructed hydrogen/electricity inputs.
  ammonia: true

  # Share of coke-oven transformation output attributed to integrated
  # steelworks (BF-BOF) in the historical calibration.
  coke_oven_allocation: 0.75

# defining the scenarios
technologies_file: config/technologies.yaml
scenario_file: config/scenarios/retain_max_electrification.yaml

spatial_disaggregation:
  regions_file: resources/user/regions.geojson
  region_id_column: name
  country_column: country

  # Optional subset of years to regionalize. Set to null to keep all years.
  years:
    - 2030
    - 2040
    - 2050

  # The primary key is always sector-specific Hotmaps data when available.
  # If it is unavailable, the options below are tried in this order.
  fallback_options:
    - generic_industry
    - population
    - user_key
    - uniform

  # Generic industrial fallback based on all Hotmaps industrial sites in the
  # same country. No additional configuration is required.

  # Optional population-based regional key. The weights do not need to sum to
  # one; they are renormalized to the regions present in the GeoJSON.
  population:
    file: resources/user/pop_layout_base_s_60.csv
    region_column: name
    country_column: ct
    weight_column: fraction

  # Optional arbitrary user-provided regional distribution key. Set file: null
  # when it is not used. It follows the same three-column concept as population.
  user_key:
    file: null
    # file: resources/user/my_regional_key.csv
    region_column: region
    country_column: country
    weight_column: share
    source_name: user_key

